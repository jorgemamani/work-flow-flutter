name: work_flow
description: WorkFlow - Gestión de empleados y roles
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.8.1

  # Dependency injection
  get_it: ^8.0.3

  # HTTP
  dio: ^5.8.0+1

  # Local storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Database
  sqflite: ^2.4.2
  path: ^1.9.0

  # Media
  image_picker: ^1.1.2

  # Utils extras
  uuid: ^4.5.1

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.1.0
  cached_network_image: ^3.4.1

  # Utils
  intl: ^0.20.2
  flutter_dotenv: ^5.2.1
  package_info_plus: ^8.3.0

  # Web
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env.dev
    - .env.staging
    - .env.prod
    - assets/images/
    - assets/icons/
