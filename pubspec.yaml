name: work_flow
description: Workflow - app de campo (personal y equipos en minas, offline)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.8.1

  # Dependency injection
  get_it: ^8.0.3

  # HTTP y conectividad
  dio: ^5.8.0+1
  connectivity_plus: ^7.3.2

  # Almacenamiento: tokens en el llavero, datos y cola en SQLite
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.6

  # Fotos y escaneo
  image_picker: ^1.1.2
  flutter_image_compress: ^2.5.1
  mobile_scanner: ^7.4.2

  # Ids de hechos (UUIDv7)
  uuid: ^4.5.1

  # UI
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.20.2
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.4.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env.dev
    - .env.staging
    - .env.prod
